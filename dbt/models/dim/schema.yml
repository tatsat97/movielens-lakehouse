version: 2

models:
  - name: dim_movies
    columns:
      - name: movie_id
        data_tests:
          - unique
          - not_null
      - name: movie_title
        data_tests:
          - not_null

  - name: dim_users
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null